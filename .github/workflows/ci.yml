name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check and formatting
        run: npm run lint:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # staging keeps the build noindex; the API falls back to the live backend
          NEXT_ENV: staging
